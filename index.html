<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOT TIMER</title>
<style>
  :root{
    --bg:#000000;
    --grid-line: rgba(255,255,255,0.055);
    --dot-off: rgba(255,255,255,0.07);
    --dot-on:#ffffff;
    --accent:#d1441f;
    --dim: rgba(255,255,255,0.38);
    --dimmer: rgba(255,255,255,0.22);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    overflow:hidden;
    font-family: 'Courier New', ui-monospace, monospace;
  }
  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 26px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    height:100vh;
    width:100vw;
    color:#fff;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }

  /* ---------- header ---------- */
  .header{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 26px;
    letter-spacing:2px;
  }
  .brand{
    font-size:11px;
    color:var(--dim);
    letter-spacing:4px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand .rdot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 6px var(--accent);
  }
  .clock{
    font-size:11px;
    color:var(--dimmer);
    letter-spacing:2px;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .fs-btn{
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.18);
    background:transparent;
    color:rgba(255,255,255,0.65);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease, transform .1s ease;
  }
  .fs-btn:hover{
    border-color:rgba(255,255,255,0.6);
    color:#fff;
  }
  .fs-btn:active{ transform:scale(0.9); }

  /* ---------- mode tabs ---------- */
  .tabs{
    display:flex;
    gap:38px;
    margin-top:6px;
  }
  .tab{
    cursor:pointer;
    padding:0;
    background:none;
    border:none;
    opacity:0.35;
    transition:opacity .25s ease;
  }
  .tab.active{ opacity:1; }
  .tab .dotrow canvas{ display:block; }

  /* ---------- main / display ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    width:100%;
  }
  .display-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .sublabel{
    font-size:11px;
    letter-spacing:5px;
    color:var(--dimmer);
  }

  .dotgrid{
    display:flex;
    gap: var(--gap, 5px);
  }
  .dotchar{
    display:grid;
    grid-template-columns: repeat(5, var(--dotsize, 12px));
    grid-template-rows: repeat(7, var(--dotsize, 12px));
    gap: var(--dotgap, 4px);
  }
  .dot{
    width:var(--dotsize,12px);
    height:var(--dotsize,12px);
    border-radius:50%;
    background:var(--dot-off);
    transition: background .18s ease, box-shadow .18s ease;
  }
  .dot.on{
    background:var(--dot-on);
    box-shadow:0 0 7px rgba(255,255,255,0.35);
  }
  .dot.on.accent{
    background:var(--accent);
    box-shadow:0 0 8px rgba(209,68,31,0.6);
  }

  /* ---------- adjust row (timer only) ---------- */
  .adjust{
    display:flex;
    align-items:center;
    gap:34px;
    min-height:120px;
  }
  .adjbtn{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.18);
    background:transparent;
    color:#fff;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition: border-color .2s ease, transform .1s ease;
  }
  .adjbtn:hover{ border-color:rgba(255,255,255,0.55); }
  .adjbtn:active{ transform:scale(0.9); }
  .adjbtn:disabled{ opacity:.25; cursor:default; }
  .adjbtn:disabled:hover{ border-color:rgba(255,255,255,0.18); }
  .adjbtn.small{
    width:26px;height:26px;
    font-size:13px;
  }
  .adjcol{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .adjval{
    font-size:20px;
    letter-spacing:1px;
    min-width:34px;
    text-align:center;
    color:#fff;
  }
  .adjlbl{
    font-size:9px;
    letter-spacing:3px;
    color:var(--dimmer);
  }

  /* ---------- controls ---------- */
  .controls{
    display:flex;
    gap:14px;
    padding-bottom:40px;
  }
  .btn{
    min-width:120px;
    padding:14px 26px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,0.22);
    background:transparent;
    color:#fff;
    font-family:inherit;
    font-size:12px;
    letter-spacing:3px;
    cursor:pointer;
    transition: all .2s ease;
    text-transform:uppercase;
  }
  .btn:hover{ border-color:rgba(255,255,255,0.6); }
  .btn:active{ transform:scale(0.96); }
  .btn.primary{
    background:#fff;
    color:#000;
    border-color:#fff;
  }
  .btn.primary.running{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.ghost{
    opacity:.7;
  }

  /* ---------- laps ---------- */
  .laps{
    position:absolute;
    right:26px;
    top:110px;
    bottom:170px;
    width:150px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-right:4px;
  }
  .laps::-webkit-scrollbar{ width:3px; }
  .laps::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); }
  .lap-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    letter-spacing:1px;
    color:var(--dim);
    border-bottom:1px solid rgba(255,255,255,0.06);
    padding-bottom:8px;
  }
  .lap-row .n{ color:var(--dimmer); }

  .footer{
    width:100%;
    display:flex;
    justify-content:center;
    padding-bottom:16px;
  }
  .footer .barcode{
    display:flex;
    gap:2px;
    align-items:flex-end;
    height:14px;
    opacity:.25;
  }
  .footer .barcode span{
    width:2px;
    background:#fff;
  }

  /* ---------- mouse spotlight ---------- */
  #spotlight{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    background: radial-gradient(
      420px circle at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.06),
      rgba(209,68,31,0.035) 40%,
      transparent 65%
    );
    transition: opacity .4s ease;
    opacity:0;
  }
  #spotlight.active{ opacity:1; }

  .display-wrap{
    transition: transform .05s linear;
    will-change: transform;
  }

  /* ---------- completion notification ---------- */
  .notify-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.88);
    backdrop-filter: blur(6px);
    opacity:0;
    pointer-events:none;
    transition: opacity .45s ease;
  }
  .notify-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .notify-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    transform: translateY(14px) scale(0.97);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .notify-overlay.show .notify-card{
    transform: translateY(0) scale(1);
  }
  .notify-dot-title .dotchar .dot.on{
    background:var(--accent);
    box-shadow:0 0 10px rgba(209,68,31,0.7);
  }
  .notify-sub{
    font-size:11px;
    letter-spacing:5px;
    color:var(--dim);
  }
  .notify-pulse{
    position:absolute;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--accent);
    animation: pulseRing 1.6s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ box-shadow:0 0 0 0 rgba(209,68,31,0.5); }
    100%{ box-shadow:0 0 0 46px rgba(209,68,31,0); }
  }

  @media (prefers-reduced-motion: reduce){
    #spotlight, .display-wrap, .notify-card{ transition:none !important; }
    .notify-pulse{ animation:none !important; }
  }

  @media (max-width:640px){
    :root{ --dotsize:8px; --dotgap:3px; --gap:4px; }
    .laps{ display:none; }
    .btn{ min-width:96px; padding:12px 18px; font-size:11px;}
    .tabs{ gap:20px; }
  }
</style>
</head>
<body>

  <div id="spotlight"></div>

  <div class="header">
    <div class="brand"><span class="rdot"></span>DOT TIMER</div>
    <div class="header-right">
      <div class="clock" id="wallclock">--:--</div>
      <button class="fs-btn" id="fsBtn" aria-label="Toggle fullscreen" title="Toggle fullscreen">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path id="fsIconPath" d="M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M8 21H4a1 1 0 0 1-1-1v-4M16 21h4a1 1 0 0 0 1-1v-4"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="main">
    <div class="display-wrap" id="displayWrap">
      <div class="sublabel" id="sublabel">TIMER</div>
      <div class="dotgrid" id="display"></div>
    </div>

    <div class="adjust" id="adjustRow"></div>
  </div>

  <div class="laps" id="laps"></div>

  <div class="controls" id="controls"></div>

  <div class="footer">
    <div class="barcode" id="barcode"></div>
  </div>

  <div class="notify-overlay" id="notifyOverlay">
    <div class="notify-card">
      <div style="position:relative;">
        <div class="notify-pulse"></div>
      </div>
      <div class="dotgrid notify-dot-title" id="notifyTitle"></div>
      <div class="notify-sub" id="notifySub">TIMER COMPLETE</div>
      <button class="btn primary" id="dismissBtn">DISMISS</button>
    </div>
  </div>

<script>
/* ============ 5x7 dot-matrix font ============ */
const FONT = {
 '0':['01110','10001','10011','10101','11001','10001','01110'],
 '1':['00100','01100','00100','00100','00100','00100','01110'],
 '2':['01110','10001','00001','00010','00100','01000','11111'],
 '3':['11111','00010','00100','00010','00001','10001','01110'],
 '4':['00010','00110','01010','10010','11111','00010','00010'],
 '5':['11111','10000','11110','00001','00001','10001','01110'],
 '6':['00110','01000','10000','11110','10001','10001','01110'],
 '7':['11111','00001','00010','00100','01000','01000','01000'],
 '8':['01110','10001','10001','01110','10001','10001','01110'],
 '9':['01110','10001','10001','01111','00001','00010','01100'],
 ':':['00000','00100','00000','00000','00100','00000','00000'],
 ' ':['00000','00000','00000','00000','00000','00000','00000'],
 'T':['11111','00100','00100','00100','00100','00100','00100'],
 'I':['01110','00100','00100','00100','00100','00100','01110'],
 'M':['10001','11011','10101','10101','10001','10001','10001'],
 'E':['11111','10000','10000','11110','10000','10000','11111'],
 'R':['11110','10001','10001','11110','10100','10010','10001'],
 'S':['01111','10000','10000','01110','00001','00001','11110'],
 'O':['01110','10001','10001','10001','10001','10001','01110'],
 'P':['11110','10001','10001','11110','10000','10000','10000'],
 'W':['10001','10001','10001','10101','10101','11011','10001'],
 'A':['01110','10001','10001','11111','10001','10001','10001'],
 'C':['01111','10000','10000','10000','10000','10000','01111'],
 'H':['10001','10001','10001','11111','10001','10001','10001'],
 'U':['10001','10001','10001','10001','10001','10001','01110'],
 'D':['11110','10001','10001','10001','10001','10001','11110'],
 'N':['10001','11001','10101','10101','10011','10001','10001'],
 'L':['10000','10000','10000','10000','10000','10000','11111'],
 'J':['00001','00001','00001','00001','10001','10001','01110'],
 'B':['11110','10001','10001','11110','10001','10001','11110'],
 'F':['11111','10000','10000','11110','10000','10000','10000'],
 'G':['01111','10000','10000','10011','10001','10001','01111'],
 'V':['10001','10001','10001','10001','10001','01010','00100'],
 'K':['10001','10010','10100','11000','10100','10010','10001'],
 'Y':['10001','10001','01010','00100','00100','00100','00100'],
};

function buildDotChar(ch){
  const pattern = FONT[ch] || FONT[' '];
  const wrap = document.createElement('div');
  wrap.className = 'dotchar';
  for(const row of pattern){
    for(const bit of row){
      const d = document.createElement('div');
      d.className = 'dot' + (bit==='1' ? ' on' : '');
      wrap.appendChild(d);
    }
  }
  return wrap;
}

function renderDots(container, text, accentOn){
  // reuse existing char nodes when length matches, to allow smooth per-dot updates
  const chars = text.split('');
  const existing = container.children;
  if(existing.length !== chars.length){
    container.innerHTML = '';
    chars.forEach(ch => container.appendChild(buildDotChar(ch)));
  }
  chars.forEach((ch, i) => {
    const pattern = FONT[ch] || FONT[' '];
    const dots = container.children[i].children;
    let idx = 0;
    for(const row of pattern){
      for(const bit of row){
        const d = dots[idx];
        const on = bit === '1';
        d.classList.toggle('on', on);
        d.classList.toggle('accent', on && accentOn);
        idx++;
      }
    }
  });
}

/* ============ small icon builders (tabs) ============ */
function miniLabel(text){
  const holder = document.createElement('div');
  holder.className = 'dotgrid dotrow';
  holder.style.setProperty('--dotsize','3px');
  holder.style.setProperty('--dotgap','1.5px');
  holder.style.setProperty('--gap','3px');
  text.split('').forEach(ch => holder.appendChild(buildDotChar(ch)));
  return holder;
}

/* ============ state ============ */
let mode = 'timer'; // 'timer' | 'stopwatch' | 'clock'

// timer state (seconds) — edited as separate H / M / S fields
let timerH = 0, timerM = 5, timerS = 0;
let timerTotal = timerH*3600 + timerM*60 + timerS;
let timerRemaining = timerTotal;
let timerRunning = false;
let timerInterval = null;
let timerEndTs = null;

// stopwatch state (ms)
let swElapsed = 0;
let swRunning = false;
let swInterval = null;
let swStartTs = null;
let laps = [];

// clock state
let clock24h = true;

const DAY_NAMES = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTH_NAMES = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

const displayEl = document.getElementById('display');
const displayWrapEl = document.getElementById('displayWrap');
const sublabelEl = document.getElementById('sublabel');
const adjustRowEl = document.getElementById('adjustRow');
const controlsEl = document.getElementById('controls');
const lapsEl = document.getElementById('laps');
const tabsEl = document.getElementById('tabs');
const spotlightEl = document.getElementById('spotlight');
const notifyOverlay = document.getElementById('notifyOverlay');
const notifyTitleEl = document.getElementById('notifyTitle');
const dismissBtn = document.getElementById('dismissBtn');

function fmt(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  if(h>0) return `${pad(h)}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}`;
}
function fmtSW(ms){
  const totalSec = ms/1000;
  const m = Math.floor(totalSec/60);
  const s = Math.floor(totalSec%60);
  const cs = Math.floor((ms%1000)/10);
  return `${pad(m)}:${pad(s)}.${pad(cs)}`;
}
function pad(n){ return n.toString().padStart(2,'0'); }

/* ============ render ============ */
function updateDisplay(){
  if(mode === 'timer'){
    sublabelEl.textContent = timerRunning ? 'COUNTING DOWN' : (timerRemaining===timerTotal ? 'SET TIMER' : 'PAUSED');
    renderDots(displayEl, fmt(timerRemaining), timerRunning);
  } else if(mode === 'stopwatch'){
    sublabelEl.textContent = swRunning ? 'RUNNING' : (swElapsed===0 ? 'STOPWATCH' : 'PAUSED');
    renderDots(displayEl, fmtSW(swElapsed), swRunning);
  } else {
    const d = new Date();
    sublabelEl.textContent = DAY_NAMES[d.getDay()] + ' ' + pad(d.getDate()) + ' ' + MONTH_NAMES[d.getMonth()];
    renderDots(displayEl, fmtClock(d), true);
  }
}

function render(){
  updateDisplay();
  renderAdjust();
  renderControls();
  renderLaps();
}

function fmtClock(d){
  let h = d.getHours();
  let suffix = '';
  if(!clock24h){
    suffix = h >= 12 ? ' PM' : ' AM';
    h = h % 12; if(h===0) h = 12;
  }
  return `${pad(h)}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${suffix}`;
}

function renderAdjust(){
  adjustRowEl.innerHTML = '';
  if(mode !== 'timer' || timerRunning) return;

  const fields = [
    {key:'timerH', label:'HRS', get:()=>timerH, max:23, set:v=>timerH=v},
    {key:'timerM', label:'MIN', get:()=>timerM, max:59, set:v=>timerM=v},
    {key:'timerS', label:'SEC', get:()=>timerS, max:59, set:v=>timerS=v},
  ];

  fields.forEach(f => {
    const col = document.createElement('div');
    col.className = 'adjcol';

    const up = document.createElement('button');
    up.className='adjbtn small'; up.textContent='+';
    up.onclick = ()=>{ f.set((f.get()+1) > f.max ? 0 : f.get()+1); syncTimerTotal(); };

    const val = document.createElement('div');
    val.className = 'adjval';
    val.textContent = pad(f.get());

    const down = document.createElement('button');
    down.className='adjbtn small'; down.textContent='–';
    down.onclick = ()=>{ f.set((f.get()-1) < 0 ? f.max : f.get()-1); syncTimerTotal(); };

    const lbl = document.createElement('div');
    lbl.className = 'adjlbl';
    lbl.textContent = f.label;

    col.appendChild(up);
    col.appendChild(val);
    col.appendChild(down);
    col.appendChild(lbl);
    adjustRowEl.appendChild(col);
  });
}

function syncTimerTotal(){
  timerTotal = timerH*3600 + timerM*60 + timerS;
  timerRemaining = timerTotal;
  render();
}

function renderControls(){
  controlsEl.innerHTML = '';
  if(mode === 'clock'){
    const fmtBtn = document.createElement('button');
    fmtBtn.className = 'btn ghost';
    fmtBtn.textContent = clock24h ? 'SWITCH TO 12H' : 'SWITCH TO 24H';
    fmtBtn.onclick = ()=>{ clock24h = !clock24h; render(); };
    controlsEl.appendChild(fmtBtn);
    return;
  }
  if(mode === 'timer'){
    const startBtn = document.createElement('button');
    startBtn.className = 'btn primary' + (timerRunning ? ' running' : '');
    startBtn.textContent = timerRunning ? 'PAUSE' : (timerRemaining < timerTotal && timerRemaining>0 ? 'RESUME' : 'START');
    startBtn.onclick = toggleTimer;

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn ghost';
    resetBtn.textContent = 'RESET';
    resetBtn.onclick = resetTimer;

    controlsEl.appendChild(startBtn);
    controlsEl.appendChild(resetBtn);
  } else {
    const startBtn = document.createElement('button');
    startBtn.className = 'btn primary' + (swRunning ? ' running' : '');
    startBtn.textContent = swRunning ? 'STOP' : (swElapsed>0 ? 'RESUME' : 'START');
    startBtn.onclick = toggleStopwatch;

    const lapBtn = document.createElement('button');
    lapBtn.className = 'btn ghost';
    lapBtn.textContent = 'LAP';
    lapBtn.disabled = !swRunning;
    lapBtn.style.opacity = swRunning ? '1' : '.3';
    lapBtn.onclick = ()=>{ if(swRunning){ laps.unshift(swElapsed); render(); } };

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn ghost';
    resetBtn.textContent = 'RESET';
    resetBtn.onclick = resetStopwatch;

    controlsEl.appendChild(startBtn);
    controlsEl.appendChild(lapBtn);
    controlsEl.appendChild(resetBtn);
  }
}

function renderLaps(){
  lapsEl.innerHTML = '';
  if(mode !== 'stopwatch' || laps.length === 0) return;
  laps.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'lap-row';
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = 'LAP ' + pad(laps.length - i);
    const v = document.createElement('span');
    v.textContent = fmtSW(t);
    row.appendChild(n);
    row.appendChild(v);
    lapsEl.appendChild(row);
  });
}

/* ============ timer logic ============ */
function toggleTimer(){
  if(timerRemaining <= 0) return;
  maybeAskNotificationPermission();
  ensureAudioCtx();
  timerRunning = !timerRunning;
  if(timerRunning){
    timerEndTs = Date.now() + timerRemaining*1000;
    timerInterval = setInterval(()=>{
      const remain = (timerEndTs - Date.now())/1000;
      timerRemaining = Math.max(0, remain);
      if(timerRemaining <= 0){
        timerRemaining = 0;
        timerRunning = false;
        clearInterval(timerInterval);
        showCompletion();
        render();
        return;
      }
      updateDisplay();
    }, 100);
  } else {
    clearInterval(timerInterval);
  }
  render();
}
function resetTimer(){
  timerRunning = false;
  clearInterval(timerInterval);
  timerRemaining = timerTotal;
  render();
}
function showCompletion(){
  renderDots(notifyTitleEl, 'TIME UP', true);
  notifyOverlay.classList.add('show');
  playEndChime();
  fireNativeNotification();
  flashComplete();
}
function flashComplete(){
  let n = 0;
  const flasher = setInterval(()=>{
    displayEl.style.opacity = displayEl.style.opacity === '0.15' ? '1' : '0.15';
    n++;
    if(n>=8){ clearInterval(flasher); displayEl.style.opacity='1'; }
  }, 220);
}
function hideCompletion(){
  notifyOverlay.classList.remove('show');
  stopEndChime();
}

/* ============ stopwatch logic ============ */
function toggleStopwatch(){
  swRunning = !swRunning;
  if(swRunning){
    swStartTs = Date.now() - swElapsed;
    swInterval = setInterval(()=>{
      swElapsed = Date.now() - swStartTs;
      updateDisplay();
    }, 30);
  } else {
    clearInterval(swInterval);
  }
  render();
}
function resetStopwatch(){
  swRunning = false;
  clearInterval(swInterval);
  swElapsed = 0;
  laps = [];
  render();
}

/* ============ mode tabs ============ */
function buildTabs(){
  tabsEl.innerHTML = '';
  const timerTab = document.createElement('button');
  timerTab.className = 'tab' + (mode==='timer' ? ' active' : '');
  timerTab.appendChild(miniLabel('TIMER'));
  timerTab.onclick = ()=>{ mode='timer'; buildTabs(); render(); };

  const swTab = document.createElement('button');
  swTab.className = 'tab' + (mode==='stopwatch' ? ' active' : '');
  swTab.appendChild(miniLabel('STOPWATCH'));
  swTab.onclick = ()=>{ mode='stopwatch'; buildTabs(); render(); };

  const clockTab = document.createElement('button');
  clockTab.className = 'tab' + (mode==='clock' ? ' active' : '');
  clockTab.appendChild(miniLabel('CLOCK'));
  clockTab.onclick = ()=>{ mode='clock'; buildTabs(); render(); };

  tabsEl.appendChild(timerTab);
  tabsEl.appendChild(swTab);
  tabsEl.appendChild(clockTab);
}

/* ============ wall clock ============ */
function tickWallClock(){
  const d = new Date();
  document.getElementById('wallclock').textContent =
    pad(d.getHours()) + ':' + pad(d.getMinutes());
  if(mode === 'clock'){
    updateDisplay();
  }
}
setInterval(tickWallClock, 1000);
tickWallClock();

/* ============ barcode footer decoration ============ */
(function buildBarcode(){
  const bc = document.getElementById('barcode');
  for(let i=0;i<40;i++){
    const bar = document.createElement('span');
    const h = 4 + Math.round(Math.random()*10);

    bc.appendChild(bar);
  }

/* ============ end-of-timer chime (Web Audio, no files needed) ============ */
let audioCtx = null;
let chimeRepeatTimer = null;

function ensureAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx) audioCtx = new Ctx();
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  return audioCtx;
}

function playChimeOnce(){
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const master = ctx.createGain();
  master.gain.value = 0.2;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 3200;
  master.connect(filter);
  filter.connect(ctx.destination);

  const notes = [523.25, 659.25, 783.99]; // C5 E5 G5 — soft ascending triad
  const now = ctx.currentTime;
  notes.forEach((freq, i) => {
    const start = now + i * 0.16;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.5, start + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0008, start + 2.2);
    osc.connect(g);
    g.connect(master);
    osc.start(start);
    osc.stop(start + 2.3);
  });
}

function playEndChime(){
  stopEndChime();
  playChimeOnce();
  chimeRepeatTimer = setInterval(playChimeOnce, 3200); // gentle repeat until dismissed
}

function stopEndChime(){
  if(chimeRepeatTimer){ clearInterval(chimeRepeatTimer); chimeRepeatTimer = null; }
}

dismissBtn.addEventListener('click', hideCompletion);

/* ============ optional native OS notification ============ */
let notifyPermissionAsked = false;
function maybeAskNotificationPermission(){
  if(notifyPermissionAsked) return;
  notifyPermissionAsked = true;
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}
function fireNativeNotification(){
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('DOT TIMER', { body: 'Time is up.', silent:true }); }catch(e){}
  }
}

/* ============ mouse-reactive ambient animation ============ */
let targetX = window.innerWidth/2, targetY = window.innerHeight/2;
let curX = targetX, curY = targetY;
let hasMouseMoved = false;

window.addEventListener('mousemove', (e)=>{
  targetX = e.clientX;
  targetY = e.clientY;
  if(!hasMouseMoved){
    hasMouseMoved = true;
    spotlightEl.classList.add('active');
  }
});
window.addEventListener('mouseleave', ()=>{
  spotlightEl.classList.remove('active');
});

function animateLoop(){
  curX += (targetX - curX) * 0.08;
  curY += (targetY - curY) * 0.08;

  const xPct = (curX / window.innerWidth) * 100;
  const yPct = (curY / window.innerHeight) * 100;
  document.documentElement.style.setProperty('--mx', xPct + '%');
  document.documentElement.style.setProperty('--my', yPct + '%');

  if(hasMouseMoved){
    const dx = (curX / window.innerWidth - 0.5) * 14;
    const dy = (curY / window.innerHeight - 0.5) * 10;
    displayWrapEl.style.transform = `translate(${dx}px, ${dy}px)`;
  }

  requestAnimationFrame(animateLoop);
}
requestAnimationFrame(animateLoop);

/* ============ fullscreen toggle ============ */
const fsBtn = document.getElementById('fsBtn');
const fsIconPath = document.getElementById('fsIconPath');
const ICON_EXPAND = "M8 3H4a1 1 0 0 0-1 1v4M16 3h4a1 1 0 0 1 1 1v4M8 21H4a1 1 0 0 1-1-1v-4M16 21h4a1 1 0 0 0 1-1v-4";
const ICON_SHRINK = "M9 3v4a1 1 0 0 1-1 1H4M15 3v4a1 1 0 0 0 1 1h4M9 21v-4a1 1 0 0 0-1-1H4M15 21v-4a1 1 0 0 1 1-1h4";

function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function updateFsIcon(){
  fsIconPath.setAttribute('d', isFullscreen() ? ICON_SHRINK : ICON_EXPAND);
}
function toggleFullscreen(){
  const el = document.documentElement;
  if(!isFullscreen()){
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(req) req.call(el).catch(()=>{});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document).catch(()=>{});
  }
}
fsBtn.addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFsIcon);
document.addEventListener('webkitfullscreenchange', updateFsIcon);

/* ============ init ============ */
buildTabs();
render();
</script>
